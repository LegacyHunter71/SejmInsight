name: Deploy SejmInsight to VPS

on:
  push:
    branches: [ test ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ./backend

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry Image Name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry Image Name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # --- TWORZYMY PLIK .ENV PRZED BUDOWANIEM ---
      - name: Create frontend .env file
        run: |
          touch frontend/.env
          echo "VITE_KEYCLOAK_URL=https://${{ vars.DOMAIN }}/auth" >> frontend/.env
          echo "VITE_KEYCLOAK_REALM=${{ vars.KC_REALM }}" >> frontend/.env
          echo "VITE_KEYCLOAK_CLIENT_ID=${{ vars.KC_FRONTEND_CLIENT_ID }}" >> frontend/.env
          echo "VITE_API_BASE_URL=https://${{ vars.DOMAIN }}/api" >> frontend/.env
          echo "Plik .env wygenerowany pomyślnie:"
          cat frontend/.env

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:latest
          # Usunęliśmy stąd build-args, bo mamy już plik .env!

  deploy:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,SejmInsight_theme.jar"
          target: "~/sejm-infra"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/sejm-infra
            IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Logowanie i pobranie obrazów
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/$IMAGE_LOWER:latest
            docker pull ghcr.io/$IMAGE_LOWER-frontend:latest

            # Generowanie .env
            cat <<EOF > .env
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            KC_DB_NAME=${{ vars.KC_DB_NAME }}
            KC_ADMIN_USER=${{ vars.KC_ADMIN_USER }}
            KC_ADMIN_PASS=${{ secrets.KC_ADMIN_PASS }}
            KC_ADMIN_CLIENT_ID=${{ vars.KC_ADMIN_CLIENT_ID }}
            KC_ADMIN_CLIENT_SECRET=${{ secrets.KC_ADMIN_CLIENT_SECRET }}
            PGADMIN_EMAIL=${{ vars.PGADMIN_EMAIL }}
            PGADMIN_PASS=${{ secrets.PGADMIN_PASS }}
            DOMAIN=${{ vars.DOMAIN }}
            KC_REALM=${{ vars.KC_REALM }}
            GITHUB_REPOSITORY_LOWER=$IMAGE_LOWER
            EOF

            # Restart kontenerów (z nowym plikiem yml i .env)
            docker compose up -d --force-recreate

            # Automatyczne tworzenie bazy Keycloaka jeśli nie istnieje
            echo "Czekam na start Postgresa..."
            sleep 5
            docker exec sejm-postgres psql -U ${{ vars.DB_USER }} -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '${{ vars.KC_DB_NAME }}'" | grep -q 1 || \
            docker exec sejm-postgres psql -U ${{ vars.DB_USER }} -d postgres -c "CREATE DATABASE ${{ vars.KC_DB_NAME }};"

            # Restart Keycloaka, żeby zobaczył nową bazę
            docker restart sejm-keycloak
