server:
  port: 8080

spring:
  application:
    name: Parliament

  datasource:
    url: jdbc:postgresql://localhost:5432/parliament_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

parliament:
  url: https://api.sejm.gov.pl/sejm/
  term: term10/MP

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.parliament: DEBUG