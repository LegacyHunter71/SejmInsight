spring:
  application:
    name: SejmInsight

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parliament_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/iam
      - classpath:db/migration/deputy
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URL:http://localhost:8081/realms/parliament-realm}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

parliament:
  url: ${SEJM_API_URL:https://api.sejm.gov.pl/sejm/}
  term: ${SEJM_API_TERM:term10/MP}
  iam:
    keycloak:
      server-url: ${KC_SERVER_URL:http://localhost:8081}
      realm: ${KC_REALM:parliament-realm}
      admin-client-id: ${KC_ADMIN_CLIENT_ID:parliament-admin-client}
      admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:9fuEM51vNfTV9YfzY600B0kkAa2olj1s}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.parliament: DEBUG
app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"