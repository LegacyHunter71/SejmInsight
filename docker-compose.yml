version: '3.8'

services:
  # 1. Baza Danych
  postgres:
    image: postgres:15-alpine
    container_name: sejm-postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-parliament_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: sejm-keycloak
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${DB_USER:-admin}
      KC_DB_PASSWORD: ${DB_PASS:-password}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASS:-admin}
      KC_FEATURES: token-exchange
    ports:
      - "${KC_PORT:-8081}:8080"
    depends_on:
      - postgres

  # 3. Interfejs do bazy
  pgadmin:
    image: dpage/pgadmin4
    container_name: sejm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sejm.pl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  # 4. APLIKACJA (SejmInsight)
  backend:
    build: ./backend
    container_name: sejm-backend
    restart: on-failure
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-parliament_db}
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-password}
      - KC_SERVER_URL=http://keycloak:8080
      - KC_ISSUER_URL=http://keycloak:8080/realms/parliament-realm
    depends_on:
      - postgres
      - keycloak

volumes:
  postgres_data: